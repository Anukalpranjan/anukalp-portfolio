backend:
  name: github
  repo: Anukalpranjan/anukalp-portfolio
  branch: main
  base_url: https://portfolio-anukalp-ranjan.vercel.app
  auth_endpoint: api/auth

media_folder: "content/images"
public_folder: "https://raw.githubusercontent.com/Anukalpranjan/anukalp-portfolio/main/content/images"

collections:
  - name: "categories"
    label: "Categories"
    label_singular: "Category"
    folder: "content/categories"
    create: true
    delete: true
    format: json
    extension: json
    slug: "{{fields.slug}}"
    summary: "{{name}} (rank {{rank}})"
    sortable_fields: ["rank", "name"]
    fields:
      - label: "Name"
        name: "name"
        widget: "string"
        hint: "Shown as the label on the site, e.g. 'Talking Head / Podcast Editing'"
      - label: "Slug"
        name: "slug"
        widget: "string"
        hint: "Internal ID — lowercase, no spaces"
        pattern: ['^[a-z0-9-]+$', "Lowercase letters, numbers, and dashes only"]
      - label: "Display Rank"
        name: "rank"
        widget: "number"
        value_type: "int"
        min: 1
        hint: "1 = shown first on the site. Change this to reorder category sections."
      - label: "Accent Color"
        name: "accent_color"
        widget: "color"
        required: false
        hint: "Optional — tints this category's badge/tag on the site"

  - name: "work"
    label: "Work"
    label_singular: "Project"
    folder: "content/work"
    create: true
    delete: true
    format: json
    extension: json
    slug: "{{fields.slug}}"
    summary: "{{title}} — {{category}}"
    sortable_fields: ["order", "date", "title"]
    fields:
      - label: "Title"
        name: "title"
        widget: "string"
      - label: "Slug"
        name: "slug"
        widget: "string"
        hint: "URL-friendly ID, auto-fills from title, editable"
        pattern: ['^[a-z0-9-]+$', "Lowercase letters, numbers, and dashes only"]

      - label: "Primary Category"
        name: "category"
        widget: "relation"
        collection: "categories"
        search_fields: ["name"]
        display_fields: ["name"]
        value_field: "slug"
        hint: "The main bucket this project lives in. New options come from the Categories collection."

      - label: "Extra Tags"
        name: "tags"
        widget: "relation"
        collection: "categories"
        search_fields: ["name"]
        display_fields: ["name"]
        value_field: "slug"
        multiple: true
        required: false
        hint: "Optional. Same list as Primary Category — use for projects that cross categories."

      - label: "Display Order"
        name: "order"
        widget: "number"
        value_type: "int"
        default: 0
        hint: "Position within this category. Lower = earlier. Ties fall back to date."

      - label: "Featured"
        name: "featured"
        widget: "boolean"
        default: false
        hint: "Pins this project to the top of its category regardless of Display Order"

      - label: "Thumbnail"
        name: "thumbnail"
        widget: "image"
        required: false
        hint: "Cover image used in the grid/list view"

      - label: "Orientation"
        name: "orientation"
        widget: "select"
        default: "vertical"
        options:
          - "vertical"
          - "horizontal"
        hint: "Controls how this card lays out — Reels/Shorts are vertical, ad films are often horizontal."

      - label: "Badge"
        name: "badge"
        widget: "string"
        required: false
        hint: "Short stat callout shown on the thumbnail, e.g. '360K Views — 48 Hours'"

      - label: "Video Source"
        name: "video_kind"
        widget: "select"
        options: ["Embed link", "Uploaded file"]
        default: "Embed link"

      - label: "Video Embed URL"
        name: "video_embed_url"
        widget: "string"
        required: false
        hint: "Fill in only if Video Source is 'Embed link'. Paste a YouTube, Vimeo, or Instagram Reel URL."

      - label: "Video File"
        name: "video_file"
        widget: "file"
        required: false
        hint: "Fill in only if Video Source is 'Uploaded file'. Keep under ~20MB — otherwise use Embed link."

      - label: "Description"
        name: "description"
        widget: "text"
        required: false

      - label: "Client"
        name: "client"
        widget: "string"
        required: false

      - label: "Tools Used"
        name: "tools_used"
        widget: "list"
        required: false
        field: { label: "Tool", name: "tool", widget: "string" }

      - label: "External Link"
        name: "external_link"
        widget: "string"
        required: false
        hint: "Optional — link to the full video, case study, or client's page"

      - label: "Date"
        name: "date"
        widget: "datetime"
        format: "YYYY-MM-DD"
        required: false

      - label: "Case Study"
        name: "case_study"
        widget: "object"
        required: false
        collapsed: true
        hint: "Only shows on the site if at least one field below is filled in."
        fields:
          - label: "What they asked for"
            name: "ask"
            widget: "text"
            required: false
          - label: "What I noticed about their existing content"
            name: "noticed"
            widget: "text"
            required: false
          - label: "What changed as a result"
            name: "changed"
            widget: "text"
            required: false

  - name: "site"
    label: "Site Content"
    files:
      - file: "content/site.json"
        label: "About / Bio / Contact"
        name: "site"
        fields:
          - label: "Name"
            name: "name"
            widget: "string"
          - label: "Role line"
            name: "role"
            widget: "string"
          - label: "Hero line 1"
            name: "hero_line_1"
            widget: "string"
          - label: "Hero line 2"
            name: "hero_line_2"
            widget: "string"
          - label: "Hero subline"
            name: "hero_subline"
            widget: "string"
          - label: "Stat number"
            name: "stat_number"
            widget: "string"
          - label: "Stat label"
            name: "stat_label"
            widget: "string"
          - label: "Age"
            name: "age"
            widget: "string"
          - label: "Speciality"
            name: "speciality"
            widget: "string"
          - label: "Based in"
            name: "based_in"
            widget: "string"
          - label: "Available for"
            name: "available_for"
            widget: "string"
          - label: "About heading 1"
            name: "about_heading_1"
            widget: "string"
          - label: "About heading 2"
            name: "about_heading_2"
            widget: "string"
          - label: "About paragraph 1"
            name: "about_paragraph_1"
            widget: "text"
          - label: "About paragraph 2"
            name: "about_paragraph_2"
            widget: "text"
          - label: "About paragraph 3"
            name: "about_paragraph_3"
            widget: "text"
          - label: "AI Tools"
            name: "ai_tools"
            widget: "list"
          - label: "Core Skills"
            name: "core_skills"
            widget: "list"
            fields:
              - label: "Name"
                name: "name"
                widget: "string"
              - label: "Level (0-100)"
                name: "level"
                widget: "number"
          - label: "Contact"
            name: "contact"
            widget: "object"
            fields:
              - label: "Email"
                name: "email"
                widget: "string"
              - label: "LinkedIn"
                name: "linkedin"
                widget: "string"
              - label: "Instagram"
                name: "instagram"
                widget: "string"
          - label: "Background Music"
            name: "background_music"
            widget: "object"
            fields:
              - label: "Enabled (turn the whole feature on/off)"
                name: "enabled"
                widget: "boolean"
                default: true
              - label: "Audio file"
                name: "file"
                widget: "file"
                required: false
                hint: "Upload an mp3/wav. If left empty, no music player or 'best with headphones' intro will show on the site, regardless of the toggle above."
              - label: "Volume (0-100)"
                name: "volume"
                widget: "number"
                default: 50
                min: 0
                max: 100
                hint: "Default playback volume. The site automatically ducks it lower while a video is playing."
          - label: "How I Work"
            name: "how_i_work"
            widget: "object"
            fields:
              - label: "Section heading"
                name: "heading"
                widget: "string"
              - label: "Steps"
                name: "steps"
                widget: "list"
                fields:
                  - label: "Timecode label"
                    name: "timecode"
                    widget: "string"
                    hint: "e.g. 00:00:15:00 — purely visual, doesn't need to be a real duration"
                  - label: "Step title"
                    name: "title"
                    widget: "string"
                  - label: "Description"
                    name: "description"
                    widget: "text"
          - label: "Second Self Mention"
            name: "second_self_mention"
            widget: "object"
            fields:
              - label: "Show this on the site"
                name: "enabled"
                widget: "boolean"
                default: true
              - label: "Text"
                name: "text"
                widget: "string"
              - label: "Link label"
                name: "link_label"
                widget: "string"
              - label: "Link URL"
                name: "link_url"
                widget: "string"
                required: false
          - label: "SEO / Link Preview"
            name: "seo"
            widget: "object"
            fields:
              - label: "Site title (shows in browser tab + link previews)"
                name: "site_title"
                widget: "string"
              - label: "Description (shows under the title when the link is pasted into DMs/social)"
                name: "meta_description"
                widget: "text"
              - label: "Preview image"
                name: "social_preview_image"
                widget: "image"
                required: false
                hint: "Shows as the thumbnail when this link is pasted into Instagram/LinkedIn DMs. Recommended 1200x630px."
          - label: "Closing line 1"
            name: "closing_line_1"
            widget: "string"
          - label: "Closing line 2"
            name: "closing_line_2"
            widget: "string"
          - label: "Closing note"
            name: "closing_note"
            widget: "text"
