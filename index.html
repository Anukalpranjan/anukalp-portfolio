<style>
/* ── TOKENS ── */
:root {
  --black: #000000;
  --ivory: #F5F5F0;
  --grey: #6E6E76;
  --rec: #FF3B30;
  --panel: #0D0D0D;
  --border: #222226;
  --anton: 'Anton', Impact, sans-serif;
  --sans: 'IBM Plex Sans', system-ui, sans-serif;
  --mono: 'IBM Plex Mono', 'Courier New', monospace;
}

/* ── RESET ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  .rec-dot { animation: none !important; opacity: 1; }
}
body {
  font-family: var(--sans);
  background: var(--black);
  color: var(--ivory);
  line-height: 1.6;
  overflow-x: hidden;
}
a { color: inherit; text-decoration: none; }
a:focus-visible, button:focus-visible {
  outline: 2px solid var(--rec);
  outline-offset: 3px;
}
button { font-family: var(--sans); cursor: pointer; border: none; background: none; }

/* ── SPLASH ── */
#splash {
  display: none;
  position: fixed;
  inset: 0;
  background: var(--black);
  z-index: 999;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
}
#splash-name { font-family: var(--anton); font-size: 2rem; color: var(--ivory); letter-spacing: 0.02em; }
#splash p { color: var(--grey); font-size: 0.88rem; font-family: var(--sans); }
#enter-btn {
  margin-top: 20px;
  padding: 10px 32px;
  border: 1px solid var(--rec);
  color: var(--rec);
  font-family: var(--mono);
  font-size: 0.75rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  transition: background 0.15s, color 0.15s;
}
#enter-btn:hover { background: var(--rec); color: var(--black); }

/* ── MUSIC TOGGLE ── */
#music-toggle {
  display: none;
  position: fixed;
  bottom: 24px;
  right: 24px;
  z-index: 200;
  width: 40px;
  height: 40px;
  border: 1px solid var(--border);
  background: var(--panel);
  color: var(--ivory);
  font-size: 16px;
}
#music-toggle:hover { border-color: var(--grey); }

/* ── LIGHTBOX ── */
#lightbox {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.96);
  z-index: 500;
  align-items: center;
  justify-content: center;
}
#lightbox.open { display: flex; }
#lightbox-inner { position: relative; width: 92%; max-width: 900px; }
#lightbox-close {
  position: absolute;
  top: -36px;
  right: 0;
  color: var(--grey);
  font-family: var(--mono);
  font-size: 0.7rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}
#lightbox-close:hover { color: var(--ivory); }
#lightbox-player { aspect-ratio: 16/9; background: #000; }
#lightbox-player iframe { width: 100%; height: 100%; border: none; }
#lightbox-yt-link {
  display: block;
  margin-top: 10px;
  font-family: var(--mono);
  font-size: 0.68rem;
  color: var(--grey);
  letter-spacing: 0.06em;
  text-transform: uppercase;
}
#lightbox-yt-link:hover { color: var(--ivory); }

/* ── NAV ── */
nav {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(0,0,0,0.92);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--border);
}
.nav-inner {
  max-width: 1100px;
  margin: 0 auto;
  padding: 0 32px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 52px;
}
#nav-name { font-family: var(--mono); font-size: 0.8rem; color: var(--ivory); letter-spacing: 0.06em; text-transform: uppercase; }
.nav-links { display: flex; gap: 32px; list-style: none; }
.nav-links a { font-family: var(--mono); font-size: 0.7rem; color: var(--grey); letter-spacing: 0.08em; text-transform: uppercase; }
.nav-links a:hover { color: var(--ivory); }

/* ── FILMSTRIP QUICK-NAV ── */
#filmstrip {
  position: sticky;
  top: 52px;
  z-index: 90;
  background: rgba(0,0,0,0.92);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--border);
  overflow: hidden;
}
.filmstrip-inner {
  max-width: 1100px;
  margin: 0 auto;
  padding: 0 32px;
  display: flex;
  align-items: center;
  height: 40px;
  gap: 0;
  overflow-x: auto;
  scrollbar-width: none;
  position: relative;
}
.filmstrip-inner::-webkit-scrollbar { display: none; }
.filmstrip-tick {
  width: 1px;
  height: 8px;
  background: var(--border);
  flex-shrink: 0;
  margin: 0 12px;
}
.filmstrip-tab {
  font-family: var(--mono);
  font-size: 0.65rem;
  color: var(--grey);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  white-space: nowrap;
  padding: 4px 0;
  border-bottom: 2px solid transparent;
  cursor: pointer;
  flex-shrink: 0;
  background: none;
  transition: color 0.15s, border-color 0.15s;
}
.filmstrip-tab:hover { color: var(--ivory); }
.filmstrip-tab.active { color: var(--ivory); border-bottom-color: var(--rec); }
#filmstrip-playhead {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 3px;
  height: 3px;
  background: var(--rec);
  transition: left 0.1s linear;
  pointer-events: none;
}
@media (prefers-reduced-motion: reduce) {
  #filmstrip-playhead { transition: none; }
}

/* ── LAYOUT ── */
.container { max-width: 1100px; margin: 0 auto; padding: 0 32px; }
@media (max-width: 768px) { .container { padding: 0 20px; } .nav-inner { padding: 0 20px; } .filmstrip-inner { padding: 0 20px; } }
section { padding: 100px 0; }

/* ── HERO ── */
#hero { padding: 80px 0 100px; border-bottom: 1px solid var(--border); }
.hero-eyebrow {
  display: flex;
  align-items: center;
  gap: 10px;
  font-family: var(--mono);
  font-size: 0.7rem;
  color: var(--grey);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  margin-bottom: 24px;
}
.rec-dot {
  width: 8px;
  height: 8px;
  background: var(--rec);
  flex-shrink: 0;
  animation: blink 1.4s step-start infinite;
}
@keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
#hero-headline {
  font-family: var(--anton);
  font-size: clamp(4rem, 10vw, 9rem);
  line-height: 0.92;
  letter-spacing: 0.01em;
  color: var(--ivory);
  text-transform: uppercase;
  margin-bottom: 28px;
}
#hero-headline span { display: block; }
#hero-subline {
  font-size: 1.05rem;
  color: var(--grey);
  font-family: var(--sans);
  font-weight: 400;
  max-width: 480px;
  line-height: 1.6;
  margin-bottom: 36px;
}
.hero-stat-row { display: flex; align-items: center; gap: 16px; }
.hero-stat-num { font-family: var(--mono); font-size: 1.3rem; font-weight: 700; color: var(--ivory); }
.hero-stat-label { font-family: var(--mono); font-size: 0.7rem; color: var(--grey); letter-spacing: 0.06em; text-transform: uppercase; }

/* ── SECTION LABELS ── */
.section-label {
  font-family: var(--mono);
  font-size: 0.65rem;
  color: var(--grey);
  letter-spacing: 0.14em;
  text-transform: uppercase;
  margin-bottom: 48px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.section-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }

/* ── WORK GRID ── */
#work-list {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 24px 32px;
}
@media (max-width: 600px) { #work-list { grid-template-columns: 1fr; } }
.work-item { position: relative; }
.work-item.clickable { cursor: pointer; }
.work-item.vertical { grid-column: span 1; }
.work-item.horizontal { grid-column: span 2; }
@media (max-width: 600px) { .work-item.horizontal { grid-column: span 1; } }

/* Corner brackets — the viewfinder treatment */
.work-thumb-wrap {
  position: relative;
  width: 100%;
  aspect-ratio: 9/16;
  background: var(--panel);
  overflow: hidden;
}
.work-item.horizontal .work-thumb-wrap { aspect-ratio: 16/9; }
.work-thumb-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; transition: opacity 0.2s; }
.work-item.clickable:hover .work-thumb-wrap img { opacity: 0.8; }

/* L-bracket corners */
.bracket { position: absolute; width: 16px; height: 16px; z-index: 2; pointer-events: none; }
.bracket-tl { top: 0; left: 0; border-top: 1px solid var(--ivory); border-left: 1px solid var(--ivory); }
.bracket-tr { top: 0; right: 0; border-top: 1px solid var(--ivory); border-right: 1px solid var(--ivory); }
.bracket-bl { bottom: 0; left: 0; border-bottom: 1px solid var(--ivory); border-left: 1px solid var(--ivory); }
.bracket-br { bottom: 0; right: 0; border-bottom: 1px solid var(--ivory); border-right: 1px solid var(--ivory); }

/* HUD overlay — category tag inside frame, bottom-left */
.work-hud {
  position: absolute;
  bottom: 10px;
  left: 12px;
  z-index: 3;
  display: flex;
  align-items: center;
  gap: 8px;
  pointer-events: none;
}
.work-hud-tag {
  font-family: var(--mono);
  font-size: 0.6rem;
  color: var(--ivory);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  background: rgba(0,0,0,0.7);
  padding: 2px 6px;
}
.work-hud-badge {
  font-family: var(--mono);
  font-size: 0.6rem;
  color: var(--rec);
  letter-spacing: 0.06em;
  background: rgba(0,0,0,0.7);
  padding: 2px 6px;
}

/* Placeholder when no thumbnail */
.thumb-placeholder {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* Play icon */
.play-icon {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1;
}
.play-icon svg { opacity: 0.6; transition: opacity 0.15s; }
.work-item.clickable:hover .play-icon svg { opacity: 1; }

.work-meta { padding: 12px 0 0; }
.work-title { font-size: 0.9rem; font-weight: 600; color: var(--ivory); margin-bottom: 3px; }
.work-client { font-family: var(--mono); font-size: 0.68rem; color: var(--grey); margin-bottom: 6px; }
.work-desc { font-size: 0.82rem; color: var(--grey); line-height: 1.5; margin-bottom: 6px; }
.watch-link {
  font-family: var(--mono);
  font-size: 0.65rem;
  color: var(--grey);
  letter-spacing: 0.06em;
  text-transform: uppercase;
}
.watch-link:hover { color: var(--ivory); }
.case-study {
  margin-top: 10px;
  padding-top: 10px;
  border-top: 1px solid var(--border);
  font-size: 0.78rem;
  color: var(--grey);
  line-height: 1.55;
}
.case-study strong {
  display: block;
  font-family: var(--mono);
  font-size: 0.62rem;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--ivory);
  margin: 8px 0 2px;
}
.case-study strong:first-child { margin-top: 0; }

/* ── PROCESS ── */
#process { border-top: 1px solid var(--border); }
.step-item {
  display: grid;
  grid-template-columns: 160px 1fr;
  gap: 0 40px;
  padding: 28px 0;
  border-bottom: 1px solid var(--border);
}
.step-item:first-child { border-top: 1px solid var(--border); }
@media (max-width: 600px) { .step-item { grid-template-columns: 1fr; gap: 6px; } }
.step-timecode { font-family: var(--mono); font-size: 0.68rem; color: var(--rec); letter-spacing: 0.04em; padding-top: 4px; }
.step-body h3 { font-size: 1rem; font-weight: 600; margin-bottom: 6px; }
.step-body p { font-size: 0.88rem; color: var(--grey); line-height: 1.65; }

/* ── ABOUT ── */
#about { border-top: 1px solid var(--border); }
.about-headline {
  font-family: var(--anton);
  font-size: clamp(2.2rem, 5vw, 4rem);
  line-height: 1;
  letter-spacing: 0.02em;
  text-transform: uppercase;
  margin-bottom: 56px;
}
.about-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 40px 64px; }
@media (max-width: 700px) { .about-grid { grid-template-columns: 1fr; } }
.about-copy p { font-size: 0.95rem; color: var(--grey); line-height: 1.8; margin-bottom: 18px; }
.about-copy p:last-child { margin-bottom: 0; }

.meta-list { margin-bottom: 36px; }
.meta-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--border); }
.meta-row:first-child { border-top: 1px solid var(--border); }
.meta-key { font-family: var(--mono); font-size: 0.65rem; color: var(--grey); letter-spacing: 0.1em; text-transform: uppercase; }
.meta-val { font-family: var(--mono); font-size: 0.75rem; color: var(--ivory); text-align: right; }

.sidebar-label { font-family: var(--mono); font-size: 0.62rem; color: var(--grey); letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 16px; }
.skill-row { margin-bottom: 14px; }
.skill-name { font-size: 0.82rem; color: var(--ivory); margin-bottom: 6px; font-family: var(--sans); }
.skill-track { height: 1px; background: var(--border); position: relative; }
.skill-fill { height: 100%; background: var(--ivory); position: absolute; top: 0; left: 0; }
.tools-wrap { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.tool-tag {
  font-family: var(--mono);
  font-size: 0.65rem;
  color: var(--grey);
  border: 1px solid var(--border);
  padding: 3px 8px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

/* ── SECOND SELF ── */
#second-self {
  display: none;
  border-left: 2px solid var(--border);
  padding: 16px 20px;
  margin-top: 48px;
}
#second-self p { font-size: 0.88rem; color: var(--grey); }
#second-self a { font-family: var(--mono); font-size: 0.78rem; color: var(--ivory); text-decoration: underline; text-underline-offset: 3px; margin-top: 6px; display: inline-block; }

/* ── CONTACT ── */
#contact { border-top: 1px solid var(--border); }
.closing-headline {
  font-family: var(--anton);
  font-size: clamp(3.5rem, 8vw, 7rem);
  line-height: 0.9;
  text-transform: uppercase;
  letter-spacing: 0.01em;
  margin-bottom: 56px;
}
.contact-table { width: 100%; }
.contact-row { display: flex; align-items: baseline; gap: 24px; padding: 14px 0; border-bottom: 1px solid var(--border); }
.contact-row:first-child { border-top: 1px solid var(--border); }
.contact-key { font-family: var(--mono); font-size: 0.65rem; color: var(--grey); letter-spacing: 0.1em; text-transform: uppercase; width: 100px; flex-shrink: 0; }
.contact-val { font-size: 0.95rem; color: var(--ivory); }
.contact-val a { color: var(--ivory); }
.contact-val a:hover { text-decoration: underline; text-underline-offset: 3px; }
.closing-note { margin-top: 40px; font-size: 0.82rem; color: var(--grey); font-style: italic; }

/* ── FOOTER ── */
footer {
  border-top: 1px solid var(--border);
  padding: 24px 0;
}
.footer-inner {
  max-width: 1100px;
  margin: 0 auto;
  padding: 0 32px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
@media (max-width: 768px) { .footer-inner { padding: 0 20px; flex-direction: column; gap: 8px; } }
.footer-copy { font-family: var(--mono); font-size: 0.65rem; color: var(--grey); letter-spacing: 0.04em; }
.footer-admin a { font-family: var(--mono); font-size: 0.62rem; color: var(--border); letter-spacing: 0.04em; }
.footer-admin a:hover { color: var(--grey); }
</style>
</head>

<script>
// ── MUSIC DUCK ──
function duckBackgroundMusic(isPlaying) {
  const audio = document.getElementById('bg-music');
  if (!audio || !audio.src) return;
  const base = parseInt(audio.dataset.baseVolume || '50', 10) / 100;
  audio.volume = isPlaying ? base * 0.15 : base;
}

// ── YOUTUBE ──
let ytApiReady = false, ytPlayer = null, pendingVideoId = null;
function loadYouTubeApi() {
  if (document.getElementById('yt-script')) return;
  const s = document.createElement('script');
  s.id = 'yt-script';
  s.src = 'https://www.youtube.com/iframe_api';
  document.head.appendChild(s);
}
window.onYouTubeIframeAPIReady = function() {
  ytApiReady = true;
  if (pendingVideoId) openLightbox(pendingVideoId);
};
function extractYouTubeId(url) {
  if (!url) return null;
  const m = url.match(/(?:youtu\.be\/|v=|\/shorts\/)([A-Za-z0-9_-]{11})/);
  return m ? m[1] : null;
}
function resetPlayerEl() {
  const old = document.getElementById('lightbox-player');
  const fresh = document.createElement('div');
  fresh.id = 'lightbox-player';
  old.parentNode.replaceChild(fresh, old);
}
function openLightbox(videoId) {
  if (!ytApiReady) { pendingVideoId = videoId; loadYouTubeApi(); return; }
  pendingVideoId = null;
  resetPlayerEl();
  document.getElementById('lightbox-yt-link').href = `https://www.youtube.com/watch?v=${videoId}`;
  ytPlayer = new YT.Player('lightbox-player', {
    videoId,
    playerVars: { autoplay: 1, rel: 0, modestbranding: 1 },
    events: { onStateChange(e) { duckBackgroundMusic(e.data === YT.PlayerState.PLAYING); } }
  });
  document.getElementById('lightbox').classList.add('open');
  document.body.style.overflow = 'hidden';
  document.getElementById('lightbox-close').focus();
}
function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  if (ytPlayer && ytPlayer.stopVideo) ytPlayer.stopVideo();
  ytPlayer = null;
  resetPlayerEl();
  document.body.style.overflow = '';
  duckBackgroundMusic(false);
}
document.getElementById('lightbox-close').addEventListener('click', closeLightbox);
document.getElementById('lightbox').addEventListener('click', e => { if (e.target === e.currentTarget) closeLightbox(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLightbox(); });

// ── FILMSTRIP PLAYHEAD ──
const playhead = document.getElementById('filmstrip-playhead');
const filmstripInner = document.getElementById('filmstrip-inner');
const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function updatePlayhead() {
  const scrollTop = window.scrollY;
  const docHeight = document.documentElement.scrollHeight - window.innerHeight;
  const pct = docHeight > 0 ? scrollTop / docHeight : 0;
  const stripWidth = filmstripInner.scrollWidth;
  playhead.style.left = (pct * stripWidth) + 'px';
}
window.addEventListener('scroll', updatePlayhead, { passive: true });

// ── MAIN LOAD ──
async function loadSite() {
  const t = Date.now();
  const [site, work] = await Promise.all([
    fetch(`https://raw.githubusercontent.com/Anukalpranjan/anukalp-portfolio/main/content/site.json?t=${t}`).then(r => r.json()),
    fetch(`https://raw.githubusercontent.com/Anukalpranjan/anukalp-portfolio/main/content/work.json?t=${t}`).then(r => r.json())
  ]);

  // SEO
  if (site.seo) {
    if (site.seo.site_title) {
      document.getElementById('page-title').textContent = site.seo.site_title;
      document.getElementById('og-title').content = site.seo.site_title;
      document.getElementById('tw-title').content = site.seo.site_title;
    }
    if (site.seo.meta_description) {
      document.getElementById('meta-desc').content = site.seo.meta_description;
      document.getElementById('og-desc').content = site.seo.meta_description;
      document.getElementById('tw-desc').content = site.seo.meta_description;
    }
    if (site.seo.social_preview_image) {
      document.getElementById('og-image').content = site.seo.social_preview_image;
      document.getElementById('tw-image').content = site.seo.social_preview_image;
    }
  }

  // BG music
  const music = site.background_music || {};
  const musicActive = !!(music.enabled && music.file);
  const audio = document.getElementById('bg-music');
  const toggle = document.getElementById('music-toggle');
  if (musicActive) {
    audio.src = music.file;
    const vol = (typeof music.volume === 'number' ? music.volume : 50) / 100;
    audio.dataset.baseVolume = music.volume ?? 50;
    audio.volume = vol;
    toggle.style.display = 'block';
    toggle.addEventListener('click', () => {
      audio.muted = !audio.muted;
      toggle.textContent = audio.muted ? '🔇' : '🔊';
      toggle.setAttribute('aria-label', audio.muted ? 'Unmute background music' : 'Mute background music');
    });
    document.getElementById('splash-name').textContent = site.name;
    const splash = document.getElementById('splash');
    splash.style.display = 'flex';
    document.getElementById('enter-btn').addEventListener('click', () => {
      splash.style.display = 'none';
      audio.play().catch(() => {});
    });
  }

  // Nav
  document.getElementById('nav-name').textContent = site.name;
  document.getElementById('footer-copy').textContent = `© ${new Date().getFullYear()} ${site.name}`;

  // Hero
  document.getElementById('hero-role').textContent = site.role;
  document.getElementById('hero-line1').textContent = site.hero_line_1;
  document.getElementById('hero-line2').textContent = site.hero_line_2;
  if (site.hero_subline) document.getElementById('hero-subline').textContent = site.hero_subline;
  document.getElementById('stat-number').textContent = site.stat_number;
  document.getElementById('stat-label').textContent = site.stat_label;

  // ── FILMSTRIP ──
  const items = work.items || [];
  const categories = [...new Set(items.map(i => i.category).filter(Boolean))];
  // Map category → first matching work item element (populated after work grid renders)
  const categoryToFirstEl = {};

  // Build tabs
  categories.forEach((cat, idx) => {
    if (idx > 0) {
      const tick = document.createElement('div');
      tick.className = 'filmstrip-tick';
      filmstripInner.appendChild(tick);
    }
    const btn = document.createElement('button');
    btn.className = 'filmstrip-tab';
    btn.textContent = cat;
    btn.dataset.cat = cat;
    btn.addEventListener('click', () => {
      document.querySelectorAll('.filmstrip-tab').forEach(t => t.classList.remove('active'));
      btn.classList.add('active');
      const el = categoryToFirstEl[cat];
      if (el) { el.scrollIntoView({ behavior: prefersReducedMotion ? 'auto' : 'smooth', block: 'start' }); }
    });
    filmstripInner.appendChild(btn);
    if (idx === 0) btn.classList.add('active');
  });

  // ── WORK GRID ──
  const workList = document.getElementById('work-list');
  workList.innerHTML = '';
  items.forEach(item => {
    const ytId = extractYouTubeId(item.video_url);
    const hasVideo = !!ytId;
    const hasCaseStudy = item.case_study && (item.case_study.ask || item.case_study.noticed || item.case_study.changed);
    const card = document.createElement('div');
    card.className = `work-item ${item.orientation || 'vertical'}${hasVideo ? ' clickable' : ''}`;
    card.setAttribute('role', 'listitem');
    card.dataset.category = item.category || '';

    if (!categoryToFirstEl[item.category]) categoryToFirstEl[item.category] = card;

    if (hasVideo) {
      card.setAttribute('tabindex', '0');
      card.setAttribute('aria-label', `Play ${item.title}`);
      card.addEventListener('click', () => openLightbox(ytId));
      card.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openLightbox(ytId); } });
    }

    const thumbSrc = item.thumbnail
      ? (item.thumbnail.startsWith('/') ? `https://raw.githubusercontent.com/Anukalpranjan/anukalp-portfolio/main${item.thumbnail}` : item.thumbnail)
      : null;
    const thumbContent = thumbSrc
      ? `<img src="${thumbSrc}" alt="${item.title}" loading="lazy">`
      : `<div class="thumb-placeholder"></div>`;

    const playIcon = hasVideo ? `<div class="play-icon" aria-hidden="true"><svg width="44" height="44" viewBox="0 0 44 44" fill="none"><path d="M18 14L32 22L18 30V14Z" fill="#F5F5F0"/></svg></div>` : '';

    const ytLinkHtml = hasVideo ? `<a class="watch-link" href="https://www.youtube.com/watch?v=${ytId}" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()">Watch on YouTube ↗</a>` : '';

    const csHtml = hasCaseStudy ? `<div class="case-study">
      ${item.case_study.ask ? `<p><strong>The ask</strong>${item.case_study.ask}</p>` : ''}
      ${item.case_study.noticed ? `<p><strong>What I noticed</strong>${item.case_study.noticed}</p>` : ''}
      ${item.case_study.changed ? `<p><strong>What changed</strong>${item.case_study.changed}</p>` : ''}
    </div>` : '';

    card.innerHTML = `
      <div class="work-thumb-wrap">
        <span class="bracket bracket-tl" aria-hidden="true"></span>
        <span class="bracket bracket-tr" aria-hidden="true"></span>
        <span class="bracket bracket-bl" aria-hidden="true"></span>
        <span class="bracket bracket-br" aria-hidden="true"></span>
        ${thumbContent}
        ${playIcon}
        <div class="work-hud">
          <span class="work-hud-tag">${item.category || ''}</span>
          ${item.badge ? `<span class="work-hud-badge">${item.badge}</span>` : ''}
        </div>
      </div>
      <div class="work-meta">
        <h3 class="work-title">${item.title}</h3>
        ${item.client ? `<p class="work-client">${item.client}</p>` : ''}
        ${item.description ? `<p class="work-desc">${item.description}</p>` : ''}
        ${ytLinkHtml}
        ${csHtml}
      </div>`;
    workList.appendChild(card);
  });

  // Update active filmstrip tab on scroll
  const observer = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        const cat = entry.target.dataset.category;
        document.querySelectorAll('.filmstrip-tab').forEach(t => {
          t.classList.toggle('active', t.dataset.cat === cat);
        });
      }
    });
  }, { threshold: 0.5 });
  document.querySelectorAll('.work-item[data-category]').forEach(el => observer.observe(el));

  // ── PROCESS ──
  const hiw = site.how_i_work || {};
  const stepsList = document.getElementById('steps-list');
  (hiw.steps || []).forEach(step => {
    const row = document.createElement('div');
    row.className = 'step-item';
    row.innerHTML = `<p class="step-timecode">${step.timecode || ''}</p><div class="step-body"><h3>${step.title}</h3><p>${step.description}</p></div>`;
    stepsList.appendChild(row);
  });

  // ── ABOUT ──
  const aboutHeadline = document.getElementById('about-headline');
  aboutHeadline.innerHTML = `${site.about_heading_1}<br>${site.about_heading_2}`;

  const aboutCopy = document.getElementById('about-copy');
  [site.about_paragraph_1, site.about_paragraph_2, site.about_paragraph_3].filter(Boolean).forEach(txt => {
    const p = document.createElement('p');
    p.textContent = txt;
    aboutCopy.appendChild(p);
  });

  const metaList = document.getElementById('meta-list');
  [
    { k: 'Age', v: site.age },
    { k: 'Speciality', v: site.speciality },
    { k: 'Based in', v: site.based_in },
    { k: 'Available for', v: site.available_for },
  ].filter(m => m.v).forEach(m => {
    metaList.innerHTML += `<div class="meta-row"><span class="meta-key">${m.k}</span><span class="meta-val">${m.v}</span></div>`;
  });

  const skillsList = document.getElementById('skills-list');
  (site.core_skills || []).forEach(skill => {
    const row = document.createElement('div');
    row.className = 'skill-row';
    row.innerHTML = `<p class="skill-name">${skill.name}</p><div class="skill-track"><div class="skill-fill" style="width:${skill.level}%"></div></div>`;
    skillsList.appendChild(row);
  });

  const toolsList = document.getElementById('tools-list');
  (site.ai_tools || []).forEach(t => {
    const tag = document.createElement('span');
    tag.className = 'tool-tag';
    tag.textContent = t;
    toolsList.appendChild(tag);
  });

  // Second Self
  const ss = site.second_self_mention;
  if (ss && ss.enabled) {
    const ssEl = document.getElementById('second-self');
    ssEl.style.display = 'block';
    document.getElementById('second-self-text').textContent = ss.text || '';
    const link = document.getElementById('second-self-link');
    link.textContent = ss.link_label || 'Second Self';
    if (ss.link_url) link.href = ss.link_url;
  }

  // ── CONTACT ──
  const cl1 = document.getElementById('closing-headline');
  cl1.innerHTML = `${site.closing_line_1}<br>${site.closing_line_2}`;
  document.getElementById('closing-note').textContent = site.closing_note;

  const ct = document.getElementById('contact-table');
  const c = site.contact || {};
  if (c.email) ct.innerHTML += `<div class="contact-row"><span class="contact-key">Email</span><span class="contact-val"><a href="mailto:${c.email}">${c.email}</a></span></div>`;
  if (c.instagram) ct.innerHTML += `<div class="contact-row"><span class="contact-key">Instagram</span><span class="contact-val">${c.instagram}</span></div>`;
  if (c.linkedin) ct.innerHTML += `<div class="contact-row"><span class="contact-key">LinkedIn</span><span class="contact-val"><a href="https://${c.linkedin}" target="_blank" rel="noopener noreferrer">${c.linkedin}</a></span></div>`;

  // Init playhead
  updatePlayhead();
}

loadSite().catch(console.error);
</script>
</body>
</html>
