<style>
/* ── TOKENS ── */
:root {
  --canvas: #0E0E10;
  --panel: #1B1B1F;
  --amber: #F2A93C;
  --white: #EDEDEF;
  --grey: #8A8A93;
  --teal: #4FA8A0;
  --grotesk: 'Space Grotesk', system-ui, sans-serif;
  --mono: 'Space Mono', monospace;
}

/* ── RESET ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}
body {
  font-family: var(--grotesk);
  background: var(--canvas);
  color: var(--white);
  line-height: 1.6;
  overflow-x: hidden;
}
a { color: var(--amber); text-decoration: none; }
a:hover { text-decoration: underline; }
a:focus-visible, button:focus-visible {
  outline: 2px solid var(--amber);
  outline-offset: 3px;
}
button { font-family: var(--grotesk); cursor: pointer; }

/* ── WAVEFORM SPINE ── */
#waveform-spine {
  position: fixed;
  left: 28px;
  top: 0;
  bottom: 0;
  width: 2px;
  z-index: 50;
  pointer-events: none;
}
#spine-track {
  position: absolute;
  top: 0;
  left: 0;
  width: 2px;
  height: 100%;
  background: color-mix(in srgb, var(--amber) 18%, transparent);
}
#spine-fill {
  position: absolute;
  top: 0;
  left: 0;
  width: 2px;
  height: 0%;
  background: var(--amber);
  transition: height 0.1s linear;
}
#spine-fill-teal {
  position: absolute;
  top: 0;
  left: -2px;
  width: 2px;
  height: 0%;
  background: var(--teal);
  opacity: 0;
  transition: opacity 0.4s, height 0.1s linear;
}
@media (prefers-reduced-motion: reduce) {
  #spine-fill { transition: none; }
  #spine-fill-teal { transition: none; }
}
@media (max-width: 768px) { #waveform-spine { display: none; } }

/* ── SPLASH ── */
#splash {
  display: none;
  position: fixed;
  inset: 0;
  background: var(--canvas);
  z-index: 999;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
}
#splash-name {
  font-family: var(--grotesk);
  font-size: 1.5rem;
  font-weight: 700;
  color: var(--white);
  letter-spacing: -0.02em;
}
#splash p {
  color: var(--grey);
  font-size: 0.9rem;
}
#enter-btn {
  margin-top: 16px;
  padding: 10px 28px;
  border: 1px solid var(--amber);
  background: none;
  color: var(--amber);
  font-family: var(--mono);
  font-size: 0.8rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  transition: background 0.2s, color 0.2s;
}
#enter-btn:hover { background: var(--amber); color: var(--canvas); }

/* ── MUSIC TOGGLE ── */
#music-toggle {
  display: none;
  position: fixed;
  bottom: 24px;
  right: 24px;
  z-index: 200;
  width: 44px;
  height: 44px;
  border-radius: 50%;
  border: 1px solid color-mix(in srgb, var(--grey) 40%, transparent);
  background: var(--panel);
  color: var(--white);
  font-size: 18px;
  line-height: 1;
  transition: border-color 0.2s;
}
#music-toggle:hover { border-color: var(--amber); }

/* ── LIGHTBOX ── */
#lightbox {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.93);
  z-index: 500;
  align-items: center;
  justify-content: center;
}
#lightbox.open { display: flex; }
#lightbox-inner {
  position: relative;
  width: 92%;
  max-width: 860px;
}
#lightbox-close {
  position: absolute;
  top: -40px;
  right: 0;
  background: none;
  border: none;
  color: var(--grey);
  font-family: var(--mono);
  font-size: 0.75rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
#lightbox-close:hover { color: var(--white); }
#lightbox-player { aspect-ratio: 16/9; background: #000; }
#lightbox-player iframe { width: 100%; height: 100%; border: none; }
#lightbox-yt-link {

  margin-top: 10px;
  font-family: var(--mono);
  font-size: 0.72rem;
  color: var(--grey);
  letter-spacing: 0.05em;
}
#lightbox-yt-link:hover { color: var(--amber); }

/* ── LAYOUT ── */
.container {
  max-width: 960px;

  padding: 0 24px 0 64px;
}
@media (max-width: 768px) { .container { padding: 0 20px; } }
section { padding: 80px 0; }
section + section { border-top: 1px solid color-mix(in srgb, var(--grey) 15%, transparent); }

/* ── NAV ── */
nav {

.nav-inner {

@media (max-width: 768px) { .nav-inner { padding: 0 20px; } }
#nav-name {

.nav-links {

}

/* ── HERO ── */

.hero-stat {

/* ── SECTION HEADINGS ── */

/* ── WORK GRID ── */

<script>
// ── MUSIC DUCK ──
function duckBackgroundMusic(isPlaying) {
  const audio = document.getElementById('bg-music');
  if (!audio || !audio.src) return;
  const base = parseInt(audio.dataset.baseVolume || '50', 10) / 100;
  audio.volume = isPlaying ? base * 0.15 : base;
}

// ── YOUTUBE ──
let ytApiReady = false;
let ytPlayer = null;
let pendingVideoId = null;

function loadYouTubeApi() {
  if (document.getElementById('yt-script')) return;
  const s = document.createElement('script');
  s.id = 'yt-script';
  s.src = 'https://www.youtube.com/iframe_api';
  document.head.appendChild(s);
}

window.onYouTubeIframeAPIReady = function() {
  ytApiReady = true;
  if (pendingVideoId) openLightbox(pendingVideoId);
};

function extractYouTubeId(url) {
  if (!url) return null;
  const m = url.match(/(?:youtu\.be\/|v=|\/shorts\/)([A-Za-z0-9_-]{11})/);
  return m ? m[1] : null;
}

function openLightbox(videoId) {
  if (!ytApiReady) {
    pendingVideoId = videoId;
    loadYouTubeApi();
    return;
  }
  pendingVideoId = null;
  const lb = document.getElementById('lightbox');
  const player = document.getElementById('lightbox-player');
  const ytLink = document.getElementById('lightbox-yt-link');
  player.innerHTML = '';
  ytLink.href = `https://www.youtube.com/watch?v=${videoId}`;
  ytPlayer = new YT.Player('lightbox-player', {
    videoId,
    playerVars: { autoplay: 1, rel: 0, modestbranding: 1 },
    events: {
      onStateChange(e) {
        duckBackgroundMusic(e.data === YT.PlayerState.PLAYING);
      }
    }
  });
  lb.classList.add('open');
  document.body.style.overflow = 'hidden';
  document.getElementById('lightbox-close').focus();
}

function closeLightbox() {
  const lb = document.getElementById('lightbox');
  lb.classList.remove('open');
  if (ytPlayer && ytPlayer.stopVideo) ytPlayer.stopVideo();
  ytPlayer = null;
  document.getElementById('lightbox-player').innerHTML = '';
  document.body.style.overflow = '';
  duckBackgroundMusic(false);
}

document.getElementById('lightbox-close').addEventListener('click', closeLightbox);
document.getElementById('lightbox').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeLightbox();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeLightbox();
});

// ── WAVEFORM SPINE ──
const spineFill = document.getElementById('spine-fill');
const spineTeal = document.getElementById('spine-fill-teal');

// Sections that trigger the teal split
let soundMomentElements = [];

function updateSpine() {
  const scrollTop = window.scrollY;
  const docHeight = document.documentElement.scrollHeight - window.innerHeight;
  const pct = docHeight > 0 ? (scrollTop / docHeight) * 100 : 0;
  spineFill.style.height = pct + '%';
  spineTeal.style.height = pct + '%';

  // Check if any sound-moment element is in viewport
  let inSoundMoment = false;
  soundMomentElements.forEach(el => {
    const r = el.getBoundingClientRect();
    if (r.top < window.innerHeight * 0.7 && r.bottom > window.innerHeight * 0.3) {
      inSoundMoment = true;
    }
  });
  spineTeal.style.opacity = inSoundMoment ? '1' : '0';
}

const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
if (!prefersReducedMotion) {
  window.addEventListener('scroll', updateSpine, { passive: true });
  updateSpine();
} else {
  spineFill.style.height = '100%';
  spineFill.style.opacity = '0.4';
}

// ── MAIN LOAD ──
async function loadSite() {
  const [site, work] = await Promise.all([
    fetch('content/site.json').then(r => r.json()),
    fetch('content/work.json').then(r => r.json())
  ]);

  // SEO
  if (site.seo) {
    if (site.seo.site_title) {
      document.getElementById('page-title').textContent = site.seo.site_title;
      document.getElementById('og-title').content = site.seo.site_title;
      document.getElementById('tw-title').content = site.seo.site_title;
    }
    if (site.seo.meta_description) {
      document.getElementById('meta-desc').content = site.seo.meta_description;
      document.getElementById('og-desc').content = site.seo.meta_description;
      document.getElementById('tw-desc').content = site.seo.meta_description;
    }
    if (site.seo.social_preview_image) {
      document.getElementById('og-image').content = site.seo.social_preview_image;
      document.getElementById('tw-image').content = site.seo.social_preview_image;
    }
  }

  // Background music
  const music = site.background_music || {};
  const musicActive = !!(music.enabled && music.file);
  const audio = document.getElementById('bg-music');
  const toggle = document.getElementById('music-toggle');
  const splash = document.getElementById('splash');

  if (musicActive) {
    audio.src = music.file;
    const vol = (typeof music.volume === 'number' ? music.volume : 50) / 100;
    audio.dataset.baseVolume = music.volume ?? 50;
    audio.volume = vol;
    toggle.style.display = 'block';
    toggle.addEventListener('click', () => {
      audio.muted = !audio.muted;
      toggle.textContent = audio.muted ? '🔇' : '🔊';
      toggle.setAttribute('aria-label', audio.muted ? 'Unmute background music' : 'Mute background music');
    });
    document.getElementById('splash-name').textContent = site.name;
    splash.style.display = 'flex';
    document.getElementById('enter-btn').addEventListener('click', () => {
      splash.style.display = 'none';
      audio.play().catch(() => {});
    });
  } else {
    splash.style.display = 'none';
  }

  // Nav + footer
  document.getElementById('nav-name').textContent = site.name;
  document.getElementById('footer-copy').textContent = `© ${new Date().getFullYear()} ${site.name}`;

  // Hero
  document.getElementById('hero-role').textContent = site.role;
  document.getElementById('hero-line1').textContent = site.hero_line_1;
  document.getElementById('hero-line2').textContent = site.hero_line_2;
  document.getElementById('stat-number').textContent = site.stat_number;
  document.getElementById('stat-label').textContent = site.stat_label;

  // Work grid
  const workList = document.getElementById('work-list');
  workList.innerHTML = '';
  (work.items || []).forEach(item => {
    const ytId = extractYouTubeId(item.video_url);
    const hasVideo = !!ytId;
    const hasCaseStudy = item.case_study && (item.case_study.ask || item.case_study.noticed || item.case_study.changed);
    const card = document.createElement('div');
    card.className = `work-item ${item.orientation || 'vertical'}${hasVideo ? ' clickable' : ''}`;
    card.setAttribute('role', 'listitem');
    if (hasVideo) {
      card.setAttribute('tabindex', '0');
      card.setAttribute('aria-label', `Play ${item.title}`);
      card.addEventListener('click', () => openLightbox(ytId));
      card.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openLightbox(ytId); } });
    }
    const thumbHtml = item.thumbnail
      ? `<img src="${item.thumbnail}" alt="${item.title}" loading="lazy">`
      : `<div class="thumb-placeholder"><span class="thumb-placeholder-tag">${item.category || ''}</span></div>`;
    const playHtml = hasVideo ? `<div class="play-icon" aria-hidden="true"><svg width="40" height="40" viewBox="0 0 40 40" fill="none"><circle cx="20" cy="20" r="19" stroke="#EDEDEF" stroke-opacity="0.4" stroke-width="1.5"/><path d="M16 13.5L28 20L16 26.5V13.5Z" fill="#EDEDEF"/></svg></div>` : '';
    const ytLinkHtml = hasVideo ? `<a class="watch-link" href="https://www.youtube.com/watch?v=${ytId}" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()">Watch on YouTube ↗</a>` : '';
    const csHtml = hasCaseStudy ? `<div class="case-study">
      ${item.case_study.ask ? `<p><strong>The ask</strong>${item.case_study.ask}</p>` : ''}
      ${item.case_study.noticed ? `<p><strong>What I noticed</strong>${item.case_study.noticed}</p>` : ''}
      ${item.case_study.changed ? `<p><strong>What changed</strong>${item.case_study.changed}</p>` : ''}
    </div>` : '';
    card.innerHTML = `
      <div class="work-thumb-wrap">${thumbHtml}${playHtml}</div>
      <div class="work-meta">
        <p class="work-tag">${item.category || ''}</p>
        <h3 class="work-title">${item.title}</h3>
        ${item.client ? `<p class="work-client">${item.client}</p>` : ''}
        ${item.badge ? `<p class="work-badge">${item.badge}</p>` : ''}
        ${item.description ? `<p class="work-desc">${item.description}</p>` : ''}
        ${ytLinkHtml}
        ${csHtml}
      </div>`;
    workList.appendChild(card);
  });

  // How I Work
  const hiw = site.how_i_work || {};
  document.getElementById('process-heading').textContent = hiw.heading || 'How I Work';
  const stepsList = document.getElementById('steps-list');
  (hiw.steps || []).forEach(step => {
    const row = document.createElement('div');
    row.className = 'step-item';
    row.innerHTML = `
      <p class="step-timecode">${step.timecode || ''}</p>
      <div class="step-body">
        <h3>${step.title}</h3>
        <p>${step.description}</p>
      </div>`;
    stepsList.appendChild(row);
  });

  // About headings
  document.getElementById('about-h1').textContent = site.about_heading_1;
  document.getElementById('about-h2').textContent = site.about_heading_2;

  // About copy — sound-first moment gets teal highlight
  const aboutCopy = document.getElementById('about-copy');
  const paras = [site.about_paragraph_1, site.about_paragraph_2, site.about_paragraph_3].filter(Boolean);
  paras.forEach((txt, i) => {
    const p = document.createElement('p');
    // Paragraph 2 is the sound-first craft paragraph per the brief
    if (i === 1) {
      p.innerHTML = txt.replace(/(sound|audio|headphones|hearing|listen)/gi, '<span class="sound-moment">$1</span>');
    } else {
      p.textContent = txt;
    }
    aboutCopy.appendChild(p);
    if (i === 1) soundMomentElements.push(p);
  });

  // Meta grid
  const metaGrid = document.getElementById('meta-grid');
  const metaItems = [
    { label: 'Age', value: site.age },
    { label: 'Speciality', value: site.speciality },
    { label: 'Based in', value: site.based_in },
    { label: 'Available for', value: site.available_for },
  ].filter(m => m.value);
  metaItems.forEach(m => {
    metaGrid.innerHTML += `<div class="meta-item"><p class="meta-label">${m.label}</p><p class="meta-value">${m.value}</p></div>`;
  });

  // Skills
  const skillsList = document.getElementById('skills-list');
  (site.core_skills || []).forEach(skill => {
    const row = document.createElement('div');
    row.className = 'skill-row';
    row.innerHTML = `<p class="skill-name">${skill.name}</p><div class="skill-bar"><div class="skill-fill" style="width:${skill.level}%"></div></div>`;
    skillsList.appendChild(row);
  });

  // AI tools
  const toolsList = document.getElementById('tools-list');
  (site.ai_tools || []).forEach(t => {
    const tag = document.createElement('span');
    tag.className = 'tool-tag';
    tag.textContent = t;
    toolsList.appendChild(tag);
  });

  // Second Self
  const ss = site.second_self_mention;
  if (ss && ss.enabled) {
    const ssEl = document.getElementById('second-self');
    ssEl.style.display = 'block';
    document.getElementById('second-self-text').textContent = ss.text || '';
    const link = document.getElementById('second-self-link');
    link.textContent = ss.link_label || 'Second Self';
    if (ss.link_url) link.href = ss.link_url;
    else link.removeAttribute('href');
  }

  // Contact
  document.getElementById('closing1').textContent = site.closing_line_1;
  document.getElementById('closing2').textContent = site.closing_line_2;
  document.getElementById('closing-note').textContent = site.closing_note;
  const contactLinks = document.getElementById('contact-links');
  const c = site.contact || {};
  if (c.email) contactLinks.innerHTML += `<div class="contact-link-item"><span class="contact-link-label">Email</span><span class="contact-link-value"><a href="mailto:${c.email}">${c.email}</a></span></div>`;
  if (c.instagram) contactLinks.innerHTML += `<div class="contact-link-item"><span class="contact-link-label">Instagram</span><span class="contact-link-value">${c.instagram}</span></div>`;
  if (c.linkedin) contactLinks.innerHTML += `<div class="contact-link-item"><span class="contact-link-label">LinkedIn</span><span class="contact-link-value"><a href="https://${c.linkedin}" target="_blank" rel="noopener noreferrer">${c.linkedin}</a></span></div>`;

  // Register sound moment — the 360K stat in hero also triggers teal
  soundMomentElements.push(document.getElementById('hero-stat'));

  // Kick off spine now that sound elements are known
  if (!prefersReducedMotion) updateSpine();
}

loadSite().catch(console.error);
</script>
</body>
</html>
