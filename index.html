<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Anukalp Ranjan — Portfolio</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Helvetica Neue', Arial, sans-serif; background: #0a0a0a; color: #f0f0f0; }
    header { padding: 4rem 2rem 2rem; text-align: center; }
    header h1 { font-size: 3rem; font-weight: 700; letter-spacing: -1px; }
    header p { margin-top: 0.75rem; font-size: 1.2rem; color: #aaa; }
    .work { max-width: 900px; margin: 3rem auto; padding: 0 2rem; }
    .work h2 { font-size: 1.5rem; border-bottom: 1px solid #333; padding-bottom: 0.5rem; margin-bottom: 1.5rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 1.5rem; }
    .card { background: #1a1a1a; border-radius: 8px; padding: 1.5rem; }
    .card h3 { font-size: 1.1rem; margin-bottom: 0.5rem; }
    .card p { font-size: 0.9rem; color: #aaa; line-height: 1.5; }
    footer { text-align: center; padding: 3rem; color: #555; font-size: 0.85rem; }
  </style>
</head>
<body>
  <header>
    <h1>Anukalp Ranjan</h1>
    <p>Video Editor &amp; Content Creator</p>
  </header>
  <section class="work">
    <h2>Selected Work</h2>
    <div class="grid">
      <div class="card">
        <h3>Project One</h3>
        <p>Edit this content from the admin panel at <a href="/admin" style="color:#888">/admin</a>.</p>
      </div>
    </div>
  </section>
  <footer>© 2026 Anukalp Ranjan</footer>
</body>
</html>
